version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-security-patches:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-security-patches:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /frontend/e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
