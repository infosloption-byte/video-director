name: Security dependency remediation

on:
  push:
    branches:
      - security/npm-vulnerability-remediation-*
    paths:
      - .github/workflows/npm-security-remediation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            server/package-lock.json
      - name: Update vulnerable package locks and run regression tests
        run: bash scripts/remediate-npm-security.sh
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-security-audit
          path: |
            frontend-audit-before.json
            frontend-audit-after.json
            server-audit-before.json
            server-audit-after.json
          if-no-files-found: ignore
      - name: Commit verified dependency updates to remediation branch
        if: success()
        run: |
          git add frontend/package.json frontend/package-lock.json server/package.json server/package-lock.json
          if git diff --cached --quiet; then
            echo "No compatible changes were generated."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(security): apply verified compatible npm dependency updates [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
