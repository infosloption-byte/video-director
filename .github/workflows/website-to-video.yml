name: Website to Video MVP checks

on:
  pull_request:
    paths:
      - 'server/src/services/website*.js'
      - 'server/src/services/websiteCampaignService.js'
      - 'server/src/services/websiteReportQuality.js'
      - 'server/src/routes/websiteAnalyses.js'
      - 'server/src/services/websiteVideoProjectCreate.js'
      - 'server/scripts/smokeWebsiteVideoProjectCreate.js'
      - 'server/src/services/storyboardService.js'
      - 'server/prisma/**'
      - 'server/test/websiteToVideoMvp.test.js'
      - 'server/test/websiteBatch2A.test.js'
      - 'server/test/websiteVideoProjectCreate.test.js'
      - 'server/test/websiteToVideo.test.js'
      - 'server/src/app.js'
      - 'frontend/src/pages/WebsiteToVideoPage.*'
      - 'frontend/src/components/PlatformShell.jsx'
      - 'frontend/src/App.jsx'
      - 'frontend/test/websiteToVideoMvp.test.js'
      - 'frontend/test/websiteBatch2A.test.js'
      - '.github/workflows/website-to-video.yml'
  workflow_dispatch:

jobs:
  website-mvp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            frontend/package-lock.json
      - name: Install backend
        working-directory: server
        run: npm ci --no-audit --no-fund
      - name: Validate Prisma schema
        working-directory: server
        env:
          DATABASE_URL: mysql://test:test@127.0.0.1:3306/voxora
        run: npx prisma validate
      - name: Check website backend JavaScript syntax
        working-directory: server
        run: |
          node --check src/services/websiteSafeFetch.js
          node --check src/services/websiteCampaignService.js
          node --check src/services/websiteReportQuality.js
          node --check src/services/websiteAnalysisService.js
          node --check src/routes/websiteAnalyses.js
          node --check src/services/websiteVideoProjectCreate.js
          node --check scripts/smokeWebsiteVideoProjectCreate.js
          node --check src/services/storyboardService.js
      - name: Website crawler and API integration tests
        working-directory: server
        run: node --test test/websiteToVideo.test.js test/websiteToVideoMvp.test.js test/websiteBatch2A.test.js test/websiteVideoProjectCreate.test.js test/generationPerformanceMonitoring.test.js
      - name: Install frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Frontend production build
        working-directory: frontend
        run: npm run build
