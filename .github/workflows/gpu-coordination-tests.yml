name: GPU coordination tests
on:
  pull_request:
    paths:
      - "gpu-media-service/media_service/gpu_lease.py"
      - "gpu-media-service/media_service/gpu_admission.py"
      - "gpu-media-service/media_service/jobs.py"
      - "gpu-media-service/tests/**"
      - "tts-service/gateway/gpu_lease.py"
      - "tts-service/gateway/app.py"
      - "tts-service/requirements/gateway.txt"
      - ".github/workflows/gpu-coordination-tests.yml"
  push:
    branches: [main]
    paths:
      - "gpu-media-service/media_service/gpu_lease.py"
      - "gpu-media-service/media_service/gpu_admission.py"
      - "gpu-media-service/media_service/jobs.py"
      - "gpu-media-service/tests/**"
      - "tts-service/gateway/gpu_lease.py"
      - "tts-service/gateway/app.py"
      - ".github/workflows/gpu-coordination-tests.yml"
permissions:
  contents: read
jobs:
  lease-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Redis client
        run: python -m pip install "redis==5.2.1"
      - name: Compile scheduler and gateway modules
        run: |
          python -m py_compile gpu-media-service/media_service/gpu_admission.py gpu-media-service/media_service/gpu_lease.py gpu-media-service/media_service/jobs.py tts-service/gateway/gpu_lease.py tts-service/gateway/app.py
      - name: Run GPU scheduler unit tests
        working-directory: gpu-media-service
        run: python -m unittest discover -s tests -p "test_gpu_*.py" -v
