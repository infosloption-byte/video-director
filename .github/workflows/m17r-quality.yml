name: M17R quality

on:
  push:
    branches:
      - main
      - m17r-research-report-ux
      - m17r-refinement-and-qa
      - m18-research-conversation
  pull_request:
    branches:
      - main

jobs:
  server-research-acceptance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        run: npm ci
      - name: Run server acceptance suite
        run: npm test

  qwen-service-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Qwen service syntax
        run: python -m py_compile server/qwen-tts/service.py server/qwen-tts/alignment.py
      - name: Run Qwen subtitle alignment regression tests
        working-directory: server/qwen-tts
        run: python test_alignment.py

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
