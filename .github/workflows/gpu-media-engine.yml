name: GPU Media Engine contract checks

on:
  pull_request:
    paths:
      - "gpu-media-service/**"
      - ".github/workflows/gpu-media-engine.yml"
  push:
    branches: [main]
    paths:
      - "gpu-media-service/**"
      - ".github/workflows/gpu-media-engine.yml"

jobs:
  gpu-media-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gpu-media-service
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight API/test requirements
        run: python -m pip install -r requirements-test.txt
      - name: Check Python syntax
        run: python -m compileall -q media_service test
      - name: Run isolated API contract tests
        run: pytest -q test/
      - name: Validate Compose spec (no services started)
        run: |
          cp .env.example .env
          docker compose -f docker-compose.gpu.yml config --quiet
