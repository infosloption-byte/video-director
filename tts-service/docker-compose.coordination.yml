# Optional overlay. Always compose with the existing LIVE TTS base file first:
# -f docker-compose.gpu.yml -f docker-compose.coordination.yml
# The base TTS compose file is currently untracked on the server; do not replace it.
services:
  gateway:
    # Intentionally disabled until end-to-end GPU scheduling is proven safe.
    environment:
      GPU_COORDINATION_ENABLED: "false"
      GPU_COORDINATION_REDIS_HOST: voxora-gpu-coordinator
      GPU_COORDINATION_REDIS_PASSWORD_FILE: /run/secrets/coordinator_password
    secrets:
      - coordinator_password
    networks:
      - default
      - coordination

networks:
  coordination:
    external: true
    name: voxora-gpu-coordination

secrets:
  coordinator_password:
    file: ../gpu-coordination/secrets/redis_password.txt
