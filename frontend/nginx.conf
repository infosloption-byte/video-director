server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploaded/rendered video assets can be large, and renders can take a
    # while — keep these generous.
    client_max_body_size 500m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # Everything under /api/ goes to the Express backend. Keeping frontend
    # and API behind the SAME origin (helix.ycusriya.online) matters here:
    # the app uses cookie-based auth (credentials: "include"), which needs
    # frontend + API on one origin to work cleanly.
    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router: let the app handle unknown paths client-side
    location / {
        try_files $uri /index.html;
    }
}
