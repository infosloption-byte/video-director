services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      # Shared MySQL (same instance voxora and friends use) instead of a
      # per-project mysql container. docker-entrypoint.sh assembles Prisma's
      # DATABASE_URL from these at boot.
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-mysql_shared}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-helix}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://redis:6379
      # Keep the render worker + editor render worker inside the API
      # process so a single container/host handles everything. Split these
      # into their own services later if rendering load needs to scale
      # independently of the API.
      RENDER_WORKER_IN_API: "true"
      EDITOR_RENDER_WORKER_IN_API: "true"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - helix_storage:/app/storage
    expose:
      - "4000"
    networks:
      - default
      - shared_mysql

  frontend:
    build:
      context: ./frontend
      args:
        VITE_AUTH_REQUIRED: "false"
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8090:80"

networks:
  default:
  shared_mysql:
    external: true
    # Must match the network the mysql_shared container actually runs on.
    # Check with: docker inspect mysql_shared --format '{{json .NetworkSettings.Networks}}'
    name: ${SHARED_MYSQL_NETWORK:-mysql_shared_net}

volumes:
  redis_data:
  helix_storage:
