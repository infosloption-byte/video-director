services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: helix
      MYSQL_USER: helix
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      # Keep the render worker + editor render worker inside the API
      # process so a single container/host handles everything. Split these
      # into their own services later if rendering load needs to scale
      # independently of the API.
      RENDER_WORKER_IN_API: "true"
      EDITOR_RENDER_WORKER_IN_API: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - helix_storage:/app/storage
    expose:
      - "4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_AUTH_REQUIRED: "false"
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8090:80"

volumes:
  mysql_data:
  redis_data:
  helix_storage:
